name: Reconcile data workers

# Drift signal for platform#446. Fleet operations iterate the `apps` registry, so a
# `pas-data-<id>` worker with no `apps` row is never redeployed and misses every rollout
# (it missed the #394 observability one). This lists the account's workers and fails the run
# when any has no registry row, so the drift is visible instead of silent.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * *" # daily

permissions:
  contents: read

concurrency:
  group: reconcile-data-workers
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: Read the apps registry
        working-directory: packages/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute pas --remote --json --command "SELECT id FROM apps ORDER BY id" \
            | jq -c '[.[0].results[] | {id}]' > "$RUNNER_TEMP/apps.json"

      - name: Report data workers with no apps row
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/data-worker-drift.mjs "$RUNNER_TEMP/apps.json"
