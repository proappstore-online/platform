name: Prune app logs

# Retention for app_logs (ADR-008). The table had no retention and nothing that
# deleted from it — harmless while unused, a growth problem in the shared `pas`
# D1 once automatic SDK capture is on.
# It also prunes the append-only rate-limit ledgers (maps_usage, sms_usage,
# notification_log) past their windows (#223).
# And the per-day / per-window counters (app_proxy_usage, app_proxy_usage_user,
# ai_daily_budget, license_validate_attempts, provision_attempts) the same way (#27).
# And the webhook delivery log (webhook_deliveries): 7 days, plus rows whose
# webhook was deleted (#27). Reported under ledgerRowsDeleted/ledgerErrors.
#
# Follows the payout-cron convention: an internal endpoint driven by a scheduled
# workflow rather than a Worker cron trigger. The trade-off is that retention now
# depends on this workflow running — so a backlog is escalated to a failure below
# rather than logged and forgotten.

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *" # daily, off-peak, offset from the hourly reconcile jobs

permissions:
  contents: read

concurrency:
  group: prune-app-logs
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
    steps:
      - name: Prune expired app log rows
        run: |
          set -euo pipefail

          test -n "$INTERNAL_TOKEN" || { echo "::error::INTERNAL_TOKEN not set"; exit 1; }

          # The endpoint is batch-limited, so drain in a bounded loop rather than
          # assuming one call clears the backlog.
          for attempt in $(seq 1 20); do
            body="$(curl -sS -X POST \
              -H "X-Internal-Token: $INTERNAL_TOKEN" \
              -H "User-Agent: gh-actions/prune-app-logs" \
              "https://api.proappstore.online/v1/internal/logs/prune")"

            echo "$body" | jq -c .

            overdue="$(echo "$body" | jq -r '.stillOverdue // 0')"
            deleted="$(echo "$body" | jq -r '.deleted // 0')"
            # Rate-limit ledgers (#223): per-table failures and a full-batch backlog.
            ledger_errors="$(echo "$body" | jq -c '.ledgerErrors // {}')"
            ledger_backlog="$(echo "$body" | jq -r '.ledgerBacklog // false')"

            if [ "$ledger_errors" != "{}" ]; then
              echo "::error::rate-limit ledger prune failed: $ledger_errors"
              exit 1
            fi

            if [ "$overdue" = "0" ] && [ "$ledger_backlog" != "true" ]; then
              echo "Retention up to date after $attempt call(s)."
              exit 0
            fi

            # No progress but work remains — retrying will not help, and silently
            # succeeding here is how retention stops working unnoticed. A ledger
            # backlog always made progress (it means a full batch was deleted).
            if [ "$overdue" != "0" ] && [ "$deleted" = "0" ] && [ "$ledger_backlog" != "true" ]; then
              echo "::error::prune made no progress with $overdue rows still overdue"
              exit 1
            fi

            echo "$overdue app-log rows still overdue, ledger backlog: $ledger_backlog; continuing."
          done

          echo "::error::prune did not drain the backlog in 20 calls"
          exit 1
