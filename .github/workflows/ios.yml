name: iOS Companion
on:
  push: { branches: [main], paths: ['ios/**', '.github/workflows/ios.yml'] }
  pull_request: { paths: ['ios/**', '.github/workflows/ios.yml'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '16' }
      - name: Project is in sync with project.yml
        run: brew install xcodegen && cd ios && xcodegen generate && git diff --exit-code -- ProAppStore.xcodeproj
      # Ad-hoc signed, not CODE_SIGNING_ALLOWED=NO: an unsigned test host has no Keychain entitlement
      # (errSecMissingEntitlement, -34018), which SecureStoreTests and PasApiTests need.
      - name: Unit tests (simulator, ad-hoc signed)
        run: xcodebuild -project ios/ProAppStore.xcodeproj -scheme ProAppStore -destination 'platform=iOS Simulator,name=iPhone 16' -derivedDataPath build/ios test CODE_SIGN_IDENTITY=-
      - name: Device build (unsigned)
        run: xcodebuild -project ios/ProAppStore.xcodeproj -scheme ProAppStore -destination 'generic/platform=iOS' -derivedDataPath build/ios build CODE_SIGNING_ALLOWED=NO
