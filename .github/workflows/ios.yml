name: iOS Companion
on:
  push: { branches: [main], paths: ['ios/**', '.github/workflows/ios.yml'] }
  pull_request: { paths: ['ios/**', '.github/workflows/ios.yml'] }
  workflow_dispatch:
    inputs:
      testflight:
        description: Archive, sign and upload to TestFlight (never submits for review)
        type: boolean
        default: false
permissions: { contents: read }
jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '16' }
      # XcodeGen is pinned (not brew's latest): generator versions change the output, e.g. 2.47 adds
      # buildArchitectures to schemes. Bump this and regenerate locally with the same version together.
      - name: Project is in sync with project.yml
        env: { XCODEGEN_VERSION: 2.45.4, XCODEGEN_SHA256: 090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef }
        run: |
          curl -fsSLo "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          cd ios && "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate && git diff --exit-code -- ProAppStore.xcodeproj
      # Build number = workflow run number and PAS_COMMIT = short SHA (both default in Config/Version.xcconfig
      # for local builds). Ad-hoc signed, not CODE_SIGNING_ALLOWED=NO: an unsigned test host has no Keychain entitlement
      # (errSecMissingEntitlement, -34018), which SecureStoreTests and PasApiTests need.
      # Runner images change which simulators exist, so a fixed device name fails at random. Use the
      # newest available iPhone simulator instead (freeappstore-online/platform 349c4dc).
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ios=sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in k.rsplit("iOS-",1)[1].split("-")]); print(next(x["udid"] for k in reversed(ios) for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Unit tests (simulator, ad-hoc signed)
        run: xcodebuild -project ios/ProAppStore.xcodeproj -scheme ProAppStore -destination 'id=${{ steps.sim.outputs.udid }}' -derivedDataPath build/ios test CODE_SIGN_IDENTITY=- CURRENT_PROJECT_VERSION=${{ github.run_number }} PAS_COMMIT=${GITHUB_SHA::7}
      - name: Device build (unsigned)
        run: xcodebuild -project ios/ProAppStore.xcodeproj -scheme ProAppStore -destination 'generic/platform=iOS' -derivedDataPath build/ios build CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} PAS_COMMIT=${GITHUB_SHA::7}

  # #685: TestFlight upload, the manual iOS release path. It runs only when dispatched on main with testflight=true
  # (never on a push), after build-test passes. It uploads a build; it never
  # submits one for review. App Store Connect has required Xcode 26 / the iOS 26 SDK since 2026-04-28
  # (developer.apple.com/news/upcoming-requirements), so this job archives with the newest stable Xcode on the macos-26 image, while
  # build-test stays on Xcode 16 for parity with local builds. Signing is manual: an Apple Distribution certificate and
  # an App Store provisioning profile for online.proappstore.companion (team 55DT52UQXE), repo-level secrets placed via ops.
  testflight:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 45
    concurrency: { group: ios-testflight, cancel-in-progress: false }
    env:
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
      # #625: the Live Activity extension (online.proappstore.companion.activity) needs its own App Store profile.
      IOS_APPSTORE_ACTIVITY_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_ACTIVITY_PROFILE_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      TEAM_ID: 55DT52UQXE
      BUNDLE_ID: online.proappstore.companion
    steps:
      - name: Signing material is present
        shell: bash
        run: |
          missing=0
          for name in IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APPSTORE_PROFILE_BASE64 IOS_APPSTORE_ACTIVITY_PROFILE_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then echo "::error::Repository secret $name is not set. Create it with ops (pas/$name, consumer github-repo-secret: proappstore-online/platform) before dispatching (#685)."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Xcode in use
        run: xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install certificate, profile and API key
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/pas-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046 # one argument per existing keychain path, by design
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "PAS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          # One App Store profile per signed target: the app, and the Live Activity extension (#625).
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile() { # <base64> <bundle id> <env name for its profile name>
            local profile="$RUNNER_TEMP/$3.mobileprovision" plist="$RUNNER_TEMP/$3.plist" uuid name app_id
            echo "$1" | base64 --decode > "$profile"
            security cms -D -i "$profile" > "$plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")
            # An App Store profile lists no devices; a development or ad-hoc profile does.
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" > /dev/null 2>&1; then
              echo "::error::The profile for $2 is not an App Store distribution profile"; exit 1
            fi
            if [[ "$app_id" != "$TEAM_ID.$2" ]]; then echo "::error::Profile is for $app_id, expected $TEAM_ID.$2"; exit 1; fi
            cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "$3=$name" >> "$GITHUB_ENV"
          }
          install_profile "$IOS_APPSTORE_PROFILE_BASE64" "$BUNDLE_ID" PAS_APP_PROFILE
          install_profile "$IOS_APPSTORE_ACTIVITY_PROFILE_BASE64" "$BUNDLE_ID.activity" PAS_ACTIVITY_PROFILE

          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "PAS_ASC_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # The workflow run number is the build number, as in build-test; it only grows, as App Store Connect requires.
      - name: Archive (Apple Distribution, App Store profile)
        run: >-
          xcodebuild -project ios/ProAppStore.xcodeproj -scheme ProAppStore -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ProAppStore.xcarchive" archive
          CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_IDENTITY="Apple Distribution"
          PAS_APP_PROFILE="$PAS_APP_PROFILE" PAS_ACTIVITY_PROFILE="$PAS_ACTIVITY_PROFILE" OTHER_CODE_SIGN_FLAGS="--keychain $PAS_KEYCHAIN"
          CURRENT_PROJECT_VERSION=${{ github.run_number }} PAS_COMMIT="${GITHUB_SHA::7}"
      - name: Privacy manifest is in the archive
        run: test -f "$RUNNER_TEMP/ProAppStore.xcarchive/Products/Applications/ProAppStore.app/PrivacyInfo.xcprivacy"
      # destination=upload exports the IPA and uploads it to App Store Connect in one step. Processing and TestFlight
      # availability follow on Apple's side; submitting for review stays a manual step in App Store Connect.
      - name: Export and upload to App Store Connect (TestFlight)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PAS_APP_PROFILE</string>
              <key>$BUNDLE_ID.activity</key><string>$PAS_ACTIVITY_PROFILE</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ProAppStore.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$PAS_ASC_KEY" -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
      - name: Release result
        if: success()
        run: echo "Uploaded build ${{ github.run_number }} ($GITHUB_SHA) of $BUNDLE_ID to App Store Connect app 6838534784 for TestFlight. Not submitted for review." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${PAS_KEYCHAIN:-}" ]]; then security delete-keychain "$PAS_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP"/PAS_*_PROFILE.mobileprovision "$RUNNER_TEMP"/PAS_*_PROFILE.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
