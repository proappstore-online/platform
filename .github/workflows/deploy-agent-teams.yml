name: Deploy Agent Teams Worker

# Deploys the proappstore-agent-teams Worker (agents.proappstore.online) on push
# to main touching the package.
#
# #637: this workflow never applies D1 migrations. deploy-backend.yml is the only
# workflow that does, after its workerd + real-D1 runtime gate. The Worker reads
# the shared `pas` D1, so before deploying it waits, read-only, until every
# committed migration has been applied — a push that adds a migration together
# with agent-teams code that needs it deploys once the backend has applied it.
#
# Worker secrets are synced from Doppler-backed GitHub secrets on every deploy
# so the Agent Teams verifier cannot drift from the API session signer.

on:
  push:
    branches: [main]
    paths:
      - 'packages/agent-teams/**'
      - 'packages/compliance/**' # the seed bundles the lettermark derivation
      - '.github/workflows/deploy-agent-teams.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-agent-teams
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r --filter './packages/*' build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Tests
        run: pnpm test
      # Read-only: `migrations list` never applies anything. Applying belongs to
      # deploy-backend.yml (#637; scripts/check-deploy-paths.mjs enforces it).
      - name: Wait for deploy-backend.yml to apply pending D1 migrations
        working-directory: packages/backend
        run: |
          for i in $(seq 1 40); do
            OUT=$(pnpm exec wrangler d1 migrations list pas --remote)
            if printf '%s' "$OUT" | grep -q 'No migrations to apply'; then echo "✓ every committed migration is applied"; exit 0; fi
            printf '%s\n' "$OUT"
            echo "attempt $i: migrations pending; deploy-backend.yml applies them. Waiting 30s"
            sleep 30
          done
          echo "✗ migrations still unapplied after 20 minutes. deploy-backend.yml applies them; check that run (its runtime gate may have failed) and re-run this deploy after it succeeds."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        working-directory: packages/agent-teams
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync shared auth secrets
        working-directory: packages/agent-teams
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          # cf-aig-authorization for the authenticated AI Gateway (Doppler pas).
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          test -n "$SESSION_SIGNING_KEY"
          test -n "$INTERNAL_TOKEN"
          printf '%s' "$SESSION_SIGNING_KEY" | pnpm exec wrangler secret put SESSION_SIGNING_KEY
          printf '%s' "$INTERNAL_TOKEN" | pnpm exec wrangler secret put INTERNAL_TOKEN
          # Guarded: only set when the Doppler→GitHub sync has propagated, so a
          # not-yet-synced secret can't overwrite the live token with an empty value.
          if [ -n "$AI_GATEWAY_TOKEN" ]; then
            printf '%s' "$AI_GATEWAY_TOKEN" | pnpm exec wrangler secret put AI_GATEWAY_TOKEN
          else
            echo "AI_GATEWAY_TOKEN not in GitHub secrets yet — leaving existing Worker secret intact"
          fi
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://agents.proappstore.online/health)
            if [ "$CODE" = "200" ]; then echo "✓ /health 200"; exit 0; fi
            echo "attempt $i: $CODE"; sleep 5
          done
          echo "✗ /health never 200"; exit 1
