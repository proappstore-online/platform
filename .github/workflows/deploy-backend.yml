name: Deploy Worker

# Auto-deploys the proappstore-api Worker on every push to main that
# touches the backend package. wrangler deploy is idempotent (it
# fingerprints the bundle), so re-runs without changes are no-ops.
#
# Migrations are applied first; if they fail, the deploy doesn't run,
# preventing a Worker from talking to a schema it doesn't expect.
#
# This workflow assumes the underlying infra exists:
#   - D1 database `pas` (create once: `wrangler d1 create pas`,
#     then uncomment the [[d1_databases]] block in wrangler.toml)
#   - api.proappstore.online custom domain (uncomment [[routes]] in
#     wrangler.toml; wrangler creates the DNS record on first deploy)
# Until those are set up, the wrangler steps fail loudly — that's the
# signal to provision them, not a CI bug.

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      # Every workspace package the backend bundles (#322; scripts/check-deploy-paths.mjs keeps this exact):
      - 'packages/build-core/**' # backend bundles build-core — redeploy when it changes
      - 'packages/compliance/**' # routes/provision.ts imports @proappstore/compliance
      - 'packages/qa-spec/**' # routes/qa.ts imports @proappstore/qa-spec
      - 'packages/data-worker/**' # scripts/embed-data-worker.mjs embeds its bundle at build time
      - 'migrations/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Don't let a slow deploy block a newer commit. Latest push wins.
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm test

      # #129: the same migrations this workflow is about to apply to production
      # run against a real D1 in workerd first, with the backend and data worker
      # exercising their hot paths on top of them.
      - name: Runtime integration tests (workerd + D1)
        run: pnpm test:runtime

      - name: Apply D1 migrations
        working-directory: packages/backend
        run: pnpm exec wrangler d1 migrations apply pas --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # #257: the Worker binds these queues and consumes them, so a deploy without them
      # fails. Idempotent: create only what is missing (a real failure, e.g. a token
      # without Queues:Edit, still fails here instead of being swallowed). The lifecycle
      # rule expires `_hook-bodies/` objects after 14 days — a backstop only; the consumer
      # deletes a spilled hook body on ack or dead-letter.
      - name: Ensure app-event queues and hook-body lifecycle
        working-directory: packages/backend
        run: |
          for queue in pas-app-events pas-app-events-dlq; do
            if pnpm exec wrangler queues info "$queue" >/dev/null 2>&1; then
              echo "queue $queue exists"
            else
              pnpm exec wrangler queues create "$queue"
            fi
          done
          if pnpm exec wrangler r2 bucket lifecycle list pas-storage | grep -q hook-bodies-14d; then
            echo "lifecycle rule hook-bodies-14d exists"
          else
            pnpm exec wrangler r2 bucket lifecycle add pas-storage hook-bodies-14d _hook-bodies/ --expire-days 14 --force
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        working-directory: packages/backend
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync shared auth secrets
        working-directory: packages/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SIGNING_KEY: ${{ secrets.SESSION_SIGNING_KEY }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          # Parent pas-apps R2 access key id — used to mint keyless deploy
          # credentials (routes/deploy.ts). Not a secret on its own; synced here
          # so it isn't committed. Optional — mint returns 503 until it's set.
          R2_PARENT_ACCESS_KEY_ID: ${{ secrets.R2_PARENT_ACCESS_KEY_ID }}
        run: |
          test -n "$SESSION_SIGNING_KEY"
          test -n "$INTERNAL_TOKEN"
          printf '%s' "$SESSION_SIGNING_KEY" | pnpm exec wrangler secret put SESSION_SIGNING_KEY
          printf '%s' "$INTERNAL_TOKEN" | pnpm exec wrangler secret put INTERNAL_TOKEN
          if [ -n "$R2_PARENT_ACCESS_KEY_ID" ]; then
            printf '%s' "$R2_PARENT_ACCESS_KEY_ID" | pnpm exec wrangler secret put R2_PARENT_ACCESS_KEY_ID
          else
            echo "note: R2_PARENT_ACCESS_KEY_ID not set — keyless deploy mint returns 503 until it is"
          fi

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" https://api.proappstore.online/health)
            if [ "$CODE" = "200" ]; then
              echo "✓ /health returned 200"
              exit 0
            fi
            echo "attempt $i: $CODE, retrying..."
            sleep 5
          done
          echo "✗ /health never returned 200 after deploy"
          exit 1
