name: Audit app-worker slots

# One-off read-only audit for #516: lists every app currently holding
# app_workers.enabled = 1, so stale/test holders can be identified and released.
# Temporary — safe to delete once #516 is resolved.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile

      - name: List enabled app-worker holders
        working-directory: packages/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute pas --remote --json \
            --command "SELECT app_id, enabled, enabled_by, enabled_at FROM app_workers WHERE enabled = 1 ORDER BY enabled_at" \
            | jq -c '.[0].results'
