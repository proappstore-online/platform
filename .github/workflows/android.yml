name: Android Companion

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router:
    uses: ProAgentStore/runner-router/.github/workflows/router.yml@v1
    secrets:
      billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}
  build:
    needs: router
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Android preview and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proappstore-android-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
