name: Android Companion

on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/*android*', 'test/android-release.test.ts', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'scripts/*android*', 'test/android-release.test.ts', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to Google Play after building and signing
        type: boolean
        default: false
      track:
        description: Google Play target track
        type: choice
        options: [internal, production]
        default: internal
      status:
        description: Draft for initial setup; completed for a ready release
        type: choice
        options: [draft, completed]
        default: draft

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  router:
    uses: ProAgentStore/runner-router/.github/workflows/router.yml@v1
    secrets:
      billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}
  build:
    needs: router
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Release pipeline regression tests
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run test/android-release.test.ts
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Android preview and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proappstore-android-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html

  release:
    needs: [router, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    timeout-minutes: 35
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      PUBLISH_PLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'push' && vars.ANDROID_PLAY_PUBLISH_ENABLED == 'true' }}
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.track || vars.ANDROID_PLAY_TRACK || 'production' }}
      PLAY_STATUS: ${{ github.event_name == 'workflow_dispatch' && inputs.status || 'completed' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Choose a monotonic Android version code
        shell: bash
        run: |
          minimum=$(sed -n 's/^versionCode=//p' android/version.properties)
          [[ "$minimum" =~ ^[1-9][0-9]*$ ]] || exit 1
          if (( GITHUB_RUN_NUMBER > minimum )); then minimum=$GITHUB_RUN_NUMBER; fi
          if [[ "$PUBLISH_PLAY" == 'true' ]]; then
            version_code=$(node scripts/android-play-release.mjs next-code "$minimum")
          else
            version_code=$minimum
          fi
          echo "ANDROID_BUILD_NUMBER=$version_code" >> "$GITHUB_ENV"
      - name: Build and verify signed APK and AAB
        run: bash scripts/build-android-release.sh
      - name: Keep signed artifacts and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: proappstore-android-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/release/release.json
            android/signing/upload-certificate.pem
      - name: Publish and verify Google Play track
        if: env.PUBLISH_PLAY == 'true'
        run: node scripts/android-play-release.mjs publish android/app/build/outputs/bundle/release/app-release.aab "$ANDROID_BUILD_NUMBER" "$PLAY_TRACK" "$PLAY_STATUS"
      - name: Release result
        if: success()
        shell: bash
        run: |
          echo "Signed APK and AAB: versionCode=$ANDROID_BUILD_NUMBER, commit=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH_PLAY" == 'true' ]]; then
            echo "Google Play track verified: $PLAY_TRACK ($PLAY_STATUS). Store review/availability is separate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Google Play upload was not requested. Signed artifacts are available for initial Play Console setup.' >> "$GITHUB_STEP_SUMMARY"
          fi
