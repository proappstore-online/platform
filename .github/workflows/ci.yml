name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: @proappstore/cli depends on @proappstore/compliance
      # via workspace:* and its typecheck reads compliance's `.d.ts` files
      # which only exist after a build. Without this, the typecheck step
      # below fails with "Cannot find module '@proappstore/compliance'".
      - run: pnpm -r --filter './packages/*' build
      - name: Design system lint
        run: bash scripts/check-design-system.sh .
      - run: pnpm -r typecheck
      # #128: the unit suite with V8 coverage. Vitest enforces the floors in
      # vitest.config.ts (global + per high-risk area) and fails the job under
      # them; scripts/coverage-gaps.mjs prints the least-covered backend routes,
      # libraries, data-worker and SDK files here and in the step summary.
      - name: Tests with coverage
        run: pnpm test:coverage

  # Cloudflare-runtime integration tests (#129): the backend and the data worker
  # run in workerd (@cloudflare/vitest-pool-workers) with a real D1 built from
  # the root migrations, R2, the Room Durable Object and service bindings — the
  # paths the mocked unit suite above cannot prove. Separate job so a runtime
  # failure is visible on its own and does not slow the fast suite.
  runtime-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - name: Runtime integration tests (workerd + D1)
        run: pnpm test:runtime

  # Release gate for the Agent Skills bundles (#176): every skills/<skill>/
  # bundle must validate (required files, no executables outside scripts/, no
  # binaries outside assets/, size caps, no secret-shaped strings, no dangling
  # links) and the committed skills/index.json + docs/skills/evaluations.md
  # must equal what the bundles produce. The same check runs under `pnpm test`
  # (test/skills-manifest.test.ts); this job makes it visible on its own.
  skills-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: skill bundles are valid and the manifest is up to date
        run: node scripts/build-skills-manifest.mjs --check

  # Drift guard: the template-app repo's deploy workflow is cloned verbatim by
  # `pas create` (CLI) and MCP `create_app` — that path has no strip-and-inject,
  # so template-app's committed workflow IS what those apps run. It must stay
  # byte-identical to the canonical generator (deployWorkflowYaml). This job
  # fails if template-app drifts, so it can never silently fall behind.
  # Source of truth: packages/admin/src/__fixtures__/canonical-deploy.yml
  # (a unit test pins that golden == generator); this checks golden == template-app.
  template-workflow-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: template-app deploy workflow is in sync with canonical
        run: node scripts/sync-template-workflow.mjs --check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
