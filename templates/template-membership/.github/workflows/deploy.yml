name: Deploy to R2

on:
  push:
    branches: [main]

# Keyless deploy: the runner mints a GitHub OIDC token (no stored secret) and
# exchanges it at the platform for short-lived, prefix-scoped R2 credentials.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

jobs:
  # Runner routing (see CLAUDE.md "CI runner rules"). Public repo: the router job
  # and every job below run on ubuntu-latest; no billing check, no secret read.
  # Private repo: GitHub-hosted while included minutes remain, self-hosted pags
  # once they are spent, using the repo-level RUNNER_BILLING_TOKEN (never an org
  # secret). No job sets its own runner label.
  router:
    # Same guard as deploy: the canonical templates never deploy, so don't route a runner for them.
    if: github.event.repository.name != 'template-app' && github.event.repository.name != 'template-marketplace'
    uses: ProAgentStore/runner-router/.github/workflows/router.yml@v1
    with:
      included-minutes: 2000
      self-hosted-labels: self-hosted,pags
    secrets:
      billing-token: ${{ secrets.RUNNER_BILLING_TOKEN }}

  deploy:
    # The approved templates (template-app, template-marketplace) are never served
    # (no registry entry) and keep APPNAME placeholders by design; the apps copied
    # from them deploy. Exact repository names: a generated app must not be skipped
    # merely because its name contains "template".
    needs: router
    if: github.event.repository.name != 'template-app' && github.event.repository.name != 'template-marketplace'
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    outputs:
      has_e2e: ${{ steps.e2e-check.outputs.has_e2e }}
      e2e_dir: ${{ steps.e2e-check.outputs.e2e_dir }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for an E2E suite
        id: e2e-check
        # Two supported layouts (#264): a root e2e/ package run against the live
        # app, or a Playwright suite inside the web workspace (web/tests/e2e with
        # web/playwright.config.*), run by its own config.
        run: |
          if [ -d e2e ]; then DIR=e2e
          elif [ -d web/tests/e2e ] && ls web/playwright.config.* >/dev/null 2>&1; then DIR=web
          else DIR=""; fi
          echo "e2e_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "has_e2e=$([ -n "$DIR" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi

      - name: Build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: |
          # Fail closed (#204): a failing build script — its tsc, or the pas check
          # prebuild — fails the deploy, and nothing is uploaded. Only a bundle with
          # no build script at all falls back to a bare vite build.
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then pnpm build
          else (cd web 2>/dev/null || true; npx vite build); fi

      - name: Locate build output
        id: dist
        run: |
          if [ -d web/dist ]; then dir=web/dist
          elif [ -d dist ]; then dir=dist
          else echo "::error::No build output (looked for ./dist and ./web/dist)"; exit 1; fi
          # Guard (#195): "Upload to R2" runs aws s3 sync --delete, which mirrors
          # this directory onto the app's live prefix. A present-but-empty build
          # (or one without an entry page) would delete every object of the
          # running app. Refuse to deploy instead.
          if [ ! -f "$dir/index.html" ]; then
            echo "::error::$dir has no index.html — refusing to deploy (sync --delete would wipe the live app)"; exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Code-health scan (VCQA, report-only)
        continue-on-error: true
        run: |
          npx -y @vibecodeqa/cli@0.44.0 --skip-tests . || true
          if [ -f .vibe-check/report.json ]; then
            mkdir -p "${{ steps.dist.outputs.dir }}/.vcqa"
            cp .vibe-check/report.json "${{ steps.dist.outputs.dir }}/.vcqa/report.json"
            [ -f .vibe-check/badge.svg ] && cp .vibe-check/badge.svg "${{ steps.dist.outputs.dir }}/.vcqa/badge.svg" || true
          fi

      - name: Apply D1 migrations (migrations.json -> platform, keyless)
        if: hashFiles('migrations.json') != '' && github.event.repository.name != 'template-app'
        run: |
          # Schema before code: apply the committed, additive-only migrations to
          # this app's D1 BEFORE the new frontend uploads and BEFORE mcp.json
          # actions register — so no action SQL ever references a column that
          # isn't there yet. Authorized by the same verified GitHub OIDC claims
          # as the deploy-credentials mint; the platform rejects any non-additive
          # (DROP/RENAME/DELETE/UPDATE) statement. Idempotent via _migrations.
          # HARD GATE: a migration failure fails the deploy — nothing ships.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.proappstore.online" | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then echo "::error::could not obtain OIDC token"; exit 1; fi
          RESP=$(curl -sS -X POST \
            "https://api.proappstore.online/v1/apps/${{ github.event.repository.name }}/migrate/oidc" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
            --data-binary @migrations.json)
          if echo "$RESP" | jq -e '.ok == true' >/dev/null; then
            echo "Applied migration(s): $(echo "$RESP" | jq -c '.applied // []'); already: $(echo "$RESP" | jq -c '.already // []')"
          else
            echo "::error::migration failed: $(echo "$RESP" | jq -c '.error // .')"; exit 1
          fi

      - name: Deploy app worker (worker/ -> platform, keyless)
        if: hashFiles('worker/package.json') != '' && github.event.repository.name != 'template-app'
        run: |
          # App worker (#253, ADR-009): build worker/ and upload its modules to the
          # platform, which hosts and invokes them behind its own entry shim. No
          # Cloudflare credential is involved: the same verified GitHub OIDC claims
          # as the deploy-credentials mint. Runs BEFORE tools registration, so a
          # first deploy's hooks register against a worker that already exists.
          # Fails the deploy when refused (e.g. app workers not enabled for the app).
          pnpm --dir worker build
          [ -f worker/dist/app.js ] || { echo "::error::worker build must produce worker/dist/app.js"; exit 1; }
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.proappstore.online" | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then echo "::error::could not obtain OIDC token"; exit 1; fi
          PARTS=()
          while IFS= read -r f; do PARTS+=(-F "${f#./}=@worker/dist/${f#./};type=application/javascript"); done \
            < <(cd worker/dist && find . -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          RESP=$(curl -sS -X PUT \
            "https://api.proappstore.online/v1/apps/${{ github.event.repository.name }}/worker/oidc" \
            -H "Authorization: Bearer $OIDC" "${PARTS[@]}")
          if echo "$RESP" | jq -e '.ok == true' >/dev/null; then
            echo "Deployed app worker $(echo "$RESP" | jq -r '.bundle_sha256') ($(echo "$RESP" | jq -r '.backend'))"
          else
            echo "::error::app worker deploy refused: $(echo "$RESP" | jq -c '.error // .')"; exit 1
          fi

      - name: Register app tools (mcp.json -> platform, keyless)
        if: hashFiles('mcp.json') != '' && github.event.repository.name != 'template-app'
        run: |
          # Registered actions must never drift from the committed manifest:
          # re-register mcp.json on every deploy, authorized by the same
          # verified GitHub OIDC claims as the deploy-credentials mint.
          # ORDER MATTERS (#120): this runs BEFORE the R2 upload. A rejected
          # manifest must block the deploy — registering after the upload left
          # the new frontend live with the previous revision's actions.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.proappstore.online" | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then echo "::error::could not obtain OIDC token"; exit 1; fi
          RESP=$(curl -sS -X PUT \
            "https://api.proappstore.online/v1/apps/${{ github.event.repository.name }}/tools/oidc" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
            --data-binary @mcp.json)
          if echo "$RESP" | jq -e '.ok == true' >/dev/null; then
            echo "Registered $(echo "$RESP" | jq -r '.registered') app tool(s)"
            echo "$RESP" | jq -r '.warnings[]? | "::warning::mcp.json: " + .'
          else
            echo "::error::tools registration failed: $(echo "$RESP" | jq -c '.error // .')"
            # Schema coherence (#33): name each action + the missing column/table.
            echo "$RESP" | jq -r '.details[]? | "::error::" + .'
            exit 1
          fi

      - name: Upload browser source maps (opt-in, keyless)
        continue-on-error: true
        run: |
          # #393 (ADR-008 decision 7): an app opts in by building hidden source maps
          # (vite: build.sourcemap: 'hidden'). They go to the platform's PRIVATE store
          # as one bundle for this commit, with the same verified GitHub OIDC claims
          # as every keyless step, never to the public bucket. Diagnostics never block
          # a deploy: a refused upload is a warning, and the next step strips the maps
          # whatever happened here.
          DIR="${{ steps.dist.outputs.dir }}"
          if [ -z "$(find "$DIR" -type f -name '*.map' -print -quit)" ]; then
            echo "No source maps in $DIR (opt in with build.sourcemap: 'hidden')"; exit 0
          fi
          node -e 'const fs=require("fs"),p=require("path"),d=process.argv[1],files={};for(const f of fs.readdirSync(d,{recursive:true}).map(String)){if(f.endsWith(".map")&&fs.statSync(p.join(d,f)).isFile())files[f.split(p.sep).join("/").slice(0,-4)]=JSON.parse(fs.readFileSync(p.join(d,f),"utf8"))}process.stdout.write(JSON.stringify({files}))' "$DIR" > "$RUNNER_TEMP/sourcemaps.json"
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.proappstore.online" | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then echo "::warning::could not obtain an OIDC token; source maps not uploaded"; exit 0; fi
          CODE=$(curl -sS -o "$RUNNER_TEMP/sourcemaps-resp.json" -w '%{http_code}' -X POST \
            "https://api.proappstore.online/v1/apps/${{ github.event.repository.name }}/sourcemaps?commitSha=${{ github.sha }}" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/sourcemaps.json")
          case "$CODE" in
            201)
              # Manifest verification: the platform recorded exactly the bytes sent.
              if [ "$(jq -r '.assetDigest' "$RUNNER_TEMP/sourcemaps-resp.json")" = "$(sha256sum "$RUNNER_TEMP/sourcemaps.json" | cut -d' ' -f1)" ]; then
                echo "Uploaded source maps for ${{ github.sha }} (digest verified)"
              else
                echo "::warning::source-map manifest digest does not match the uploaded bundle"
              fi ;;
            409) echo "Source maps for ${{ github.sha }} were already uploaded (releases are immutable)" ;;
            *) echo "::warning::source-map upload refused (HTTP $CODE): $(jq -c '.error // .' "$RUNNER_TEMP/sourcemaps-resp.json" 2>/dev/null)" ;;
          esac

      - name: Strip source maps from the public build
        run: |
          # Always, opted in or not: the public bucket never carries a map (#393).
          DIR="${{ steps.dist.outputs.dir }}"
          ( cd "$DIR" && find . -type f -name '*.map' | sed 's|^\./||' ) > "$RUNNER_TEMP/stripped-maps.txt"
          N=$(wc -l < "$RUNNER_TEMP/stripped-maps.txt" | tr -d ' ')
          find "$DIR" -type f -name '*.map' -delete
          echo "Removed $N source map(s) from $DIR"
          # Nothing left may need a map (the ChessClubs gate, chess-clubs#217): a service
          # worker that precaches a deleted map fails to install.
          if [ -n "$(find "$DIR" -type f -name '*.map' -print -quit)" ]; then
            echo "::error::source maps are still in $DIR"; exit 1
          fi
          if grep -rlE '"?url"?[[:space:]]*:[[:space:]]*"[^"]+\.map"' "$DIR" --include='*.js' >/dev/null; then
            echo "::error::a service-worker precache lists a .map file: keep maps out of workbox globPatterns and set workbox sourcemap: false"; exit 1
          fi

      - name: Mint deploy credentials (keyless — GitHub OIDC → platform)
        run: |
          # 1. Ask GitHub for an OIDC token scoped to the platform audience.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.proappstore.online" | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then echo "::error::could not obtain OIDC token"; exit 1; fi
          # 2. Exchange it for short-lived, prefix-scoped R2 credentials.
          RESP=$(curl -sS -X POST \
            "https://api.proappstore.online/v1/apps/${{ github.event.repository.name }}/deploy-credentials" \
            -H "Authorization: Bearer $OIDC")
          AKID=$(echo "$RESP" | jq -r '.accessKeyId // empty')
          if [ -z "$AKID" ]; then echo "::error::deploy-credentials failed: $(echo "$RESP" | jq -c '.error // .')"; exit 1; fi
          # 3. Export masked, ephemeral creds for the upload step.
          echo "::add-mask::$(echo "$RESP" | jq -r '.secretAccessKey')"
          echo "::add-mask::$(echo "$RESP" | jq -r '.sessionToken')"
          {
            echo "AWS_ACCESS_KEY_ID=$AKID"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$RESP" | jq -r '.secretAccessKey')"
            echo "AWS_SESSION_TOKEN=$(echo "$RESP" | jq -r '.sessionToken')"
            echo "R2_ENDPOINT=$(echo "$RESP" | jq -r '.endpoint')"
          } >> "$GITHUB_ENV"

      - name: Upload to R2
        env:
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync "${{ steps.dist.outputs.dir }}" "s3://pas-apps/apps/${{ github.event.repository.name }}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --delete --no-progress
          echo "Deployed apps/${{ github.event.repository.name }} from ${{ github.sha }}"

      - name: Verify source maps are not public
        run: |
          # #393: the maps went to the private store only. Prove the public origin does
          # not serve them (chess-clubs#217): a response that is a source map fails the
          # deploy, whatever its status; an SPA fallback or a private app's refusal is not one.
          LIST="$RUNNER_TEMP/stripped-maps.txt"
          if [ ! -s "$LIST" ]; then echo "No source maps in this build"; exit 0; fi
          ORIGIN="https://${{ github.event.repository.name }}.proappstore.online"
          LEAKED=0; CHECKED=0
          while IFS= read -r P; do
            CHECKED=$((CHECKED + 1))
            case "$(curl -sS --max-time 10 "$ORIGIN/$P" || true)" in
              *'"mappings"'*) echo "::error::$ORIGIN/$P serves a source map"; LEAKED=1 ;;
            esac
          done < <(head -n 5 "$LIST")
          [ "$LEAKED" = 0 ] && echo "Checked $CHECKED map path(s): none served publicly"
          exit $LEAKED

      - name: Publish marketing site (marketing/ -> about-<app>, keyless)
        if: hashFiles('marketing/package.json') != ''
        continue-on-error: true
        env:
          APP_ID: ${{ github.event.repository.name }}
          REVISION: ${{ github.sha }}
        run: |
          # #408: build the app's marketing/ folder and publish it to
          # https://about-<app>.proappstore.online/ as an immutable revision named by
          # this commit. The platform re-verifies every file before it goes live, and
          # only a successful activation switches the site, so a broken build, upload
          # or activation leaves the previous revision serving. Same keyless OIDC
          # trust as the steps above; never blocks the app deploy (continue-on-error).
          # A marketing/ added to an existing app (pas marketing add, #410) is not a
          # pnpm workspace member, so the Install step above skipped it: install it
          # on its own, leaving the app's lockfile alone.
          [ -x marketing/node_modules/.bin/astro ] || pnpm --dir marketing install --ignore-workspace --no-frozen-lockfile
          pnpm --dir marketing build
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readdirSync, readFileSync, statSync } from 'node:fs';
          import { join, relative, sep } from 'node:path';
          const { APP_ID, REVISION, ACTIONS_ID_TOKEN_REQUEST_URL: tokenUrl, ACTIONS_ID_TOKEN_REQUEST_TOKEN: tokenAuth } = process.env;
          const API = 'https://api.proappstore.online/v1/apps/' + APP_ID + '/marketing/';
          const SITE = 'https://about-' + APP_ID + '.proappstore.online';
          // The platform's MARKETING_CONTENT_TYPES (backend lib/marketing-artifact.ts).
          const TYPES = { html: 'text/html; charset=utf-8', css: 'text/css; charset=utf-8', xml: 'application/xml; charset=utf-8', txt: 'text/plain; charset=utf-8', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', ico: 'image/x-icon', svg: 'image/svg+xml', woff2: 'font/woff2' };
          const DIST = 'marketing/dist';
          const files = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir).sort()) {
              const full = join(dir, name);
              if (statSync(full).isDirectory()) { walk(full); continue; }
              const path = '/' + relative(DIST, full).split(sep).join('/');
              if (path.endsWith('.map')) continue; // source maps are never published
              const type = TYPES[path.split('.').pop().toLowerCase()];
              if (!type) throw new Error('unsupported file in marketing/dist: ' + path);
              const bytes = readFileSync(full);
              files.push({ path, contentType: type, size: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex'), bytes });
            }
          };
          walk(DIST);
          const manifest = JSON.stringify({ schemaVersion: 1, appId: APP_ID, revision: REVISION, preview: false, origin: SITE,
            files: files.map(({ path, contentType, size, sha256 }) => ({ path, contentType, size, sha256 })) });
          const token = async () => {
            const r = await fetch(tokenUrl + '&audience=' + encodeURIComponent('https://api.proappstore.online'), { headers: { Authorization: 'bearer ' + tokenAuth } });
            if (!r.ok) throw new Error('OIDC token request failed (' + r.status + ')');
            return (await r.json()).value;
          };
          const call = async (method, path, body, json) => {
            const r = await fetch(API + path, { method, body, headers: { Authorization: 'Bearer ' + (await token()), ...(json ? { 'Content-Type': 'application/json' } : {}) } });
            const text = await r.text();
            if (!r.ok) throw new Error(method + ' ' + path + ' -> ' + r.status + ': ' + text.slice(0, 300));
            return JSON.parse(text);
          };
          const form = new FormData();
          form.set('manifest', manifest);
          for (const f of files) form.append(f.path, new Blob([f.bytes], { type: f.contentType }), f.path.split('/').pop());
          console.log('Uploaded', JSON.stringify(await call('PUT', 'revisions/' + REVISION, form, false)));
          const activation = await call('POST', 'activate', JSON.stringify({ revision: REVISION }), true);
          console.log('Activated', JSON.stringify(activation));
          // Live check: the site answers from this revision.
          let problem = 'not checked';
          for (let attempt = 0; attempt < 5 && problem; attempt++) {
            if (attempt) await new Promise((r) => setTimeout(r, 3000));
            problem = null;
            for (const method of ['GET', 'HEAD']) {
              const r = await fetch(SITE + '/', { method, cache: 'no-store' });
              const served = r.headers.get('x-pas-marketing-revision');
              if (r.status !== 200 || served !== REVISION) problem = method + ' / -> ' + r.status + ' revision ' + served;
            }
          }
          if (!problem) { console.log('Marketing site live: ' + SITE + '/ (' + REVISION + ')'); process.exit(0); }
          console.log('::error::marketing site live check failed: ' + problem);
          if (activation.previous && !activation.unchanged) {
            console.log('Rolled back', JSON.stringify(await call('POST', 'rollback', JSON.stringify({ revision: activation.previous }), true)));
          }
          process.exit(1);
          JS

      - name: Trigger post-deploy QA flows (keyless — GitHub OIDC)
        continue-on-error: true
        run: |
          # Queue the platform's QA flows against the freshly deployed app. Specs
          # live in the platform, never in this repo; execution happens in
          # Cloudflare Browser Rendering. Same OIDC trust as the credential mint.
          # Advisory: a failure here never blocks the deploy (results land in the
          # platform QA run history).
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.proappstore.online" | jq -r '.value')
          [ -n "$OIDC" ] && [ "$OIDC" != "null" ] || { echo "no OIDC token"; exit 0; }
          curl -sS -X POST "https://api.proappstore.online/v1/apps/${{ github.event.repository.name }}/qa/runs" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
            --data '{"trigger":"deploy"}' | head -c 400; echo

  # Behavioural gate: drive the LIVE app in a real browser (the thing tsc/build
  # can't check). Runs after deploy; a failure fails the run, so the deploy
  # gate routes the ticket back to Dev with the Playwright output. Auth uses a
  # platform fixture session via the SDK's real sign-in path (no test bypass);
  # auth-gated specs skip when PAS_E2E_SESSION_TOKEN is unset.
  e2e:
    needs: [router, deploy]
    if: needs.deploy.outputs.has_e2e == 'true'
    runs-on: ${{ fromJSON(needs.router.outputs.runner) }}
    defaults:
      run:
        working-directory: ${{ needs.deploy.outputs.e2e_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install E2E deps
        # e2e/ is its own package; a web/ suite uses the app's workspace install.
        run: |
          if [ "${{ needs.deploy.outputs.e2e_dir }}" = "e2e" ]; then npm install
          else cd "$GITHUB_WORKSPACE" && pnpm install --frozen-lockfile; fi
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        id: e2e
        continue-on-error: true
        env:
          E2E_BASE_URL: https://${{ github.event.repository.name }}.proappstore.online
          E2E_SESSION_TOKEN: ${{ secrets.PAS_E2E_SESSION_TOKEN }}
        run: npx playwright test
      - name: Publish test results (kb.proappstore.online/<app>/.e2e/summary.json)
        if: always()
        env:
          APP: ${{ github.event.repository.name }}
        run: |
          node -e '
            const fs=require("fs");
            let r={}; for(const f of ["results.json","test-results/results.json"]){ try{ r=JSON.parse(fs.readFileSync(f,"utf8")); break; }catch{} }
            const s=r.stats||{}, specs=[];
            const walk=(su=[])=>su.forEach(x=>{ (x.specs||[]).forEach(sp=>specs.push({title:[x.title,sp.title].filter(Boolean).join(" > "),ok:sp.ok!==false})); walk(x.suites||[]); });
            walk(r.suites||[]);
            fs.writeFileSync("summary.json", JSON.stringify({ ranAt:new Date().toISOString(), passed:s.expected||0, failed:s.unexpected||0, flaky:s.flaky||0, skipped:s.skipped||0, ok:(s.unexpected||0)===0, specs }));
          '
          # Keyless (#57): mint an OIDC token bound to this repo instead of the
          # shared INTERNAL_TOKEN. kb-host derives the app prefix from the
          # `repository` claim, so this run can only write its own app's prefix.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=proappstore-kb-host" | jq -r '.value')
          # Non-fatal: test results are diagnostics, not a deploy gate.
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then
            echo "skipped results upload (could not obtain OIDC token)"
          elif curl -fsS -X PUT "https://kb.proappstore.online/_ingest/$APP/.e2e/summary.json" -H "Authorization: Bearer $OIDC" --data-binary @summary.json >/dev/null; then
            echo "results → kb.proappstore.online/$APP/.e2e/summary.json"
          else
            echo "skipped results upload (ingest rejected the write)"
          fi
      - name: Fail the run if E2E failed (bounces the ticket to Dev)
        if: steps.e2e.outcome != 'success'
        run: echo "::error::E2E tests failed — see the results above" && exit 1
