<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pas-auth-mode" content="platform-cookie">
  <title>PAS offline reference</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root { color-scheme: light dark; --paper: Canvas; --ink: CanvasText; --panel: Canvas; --muted: GrayText; --line: GrayText; --accent: LinkText; --radius: 8px; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    main { overflow-wrap: anywhere; }
    .reference { padding: 16px; max-width: 640px; margin: auto; }
    .reference button { min-height: 44px; margin: 4px; padding: 8px 16px; }
    .reference textarea { width: 100%; box-sizing: border-box; min-height: 90px; }
  </style>
</head>
<body><div id="root"></div><script type="module" src="/app.js"></script></body>
</html>
