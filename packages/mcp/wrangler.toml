name = "proappstore-mcp"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# De-minify Worker stack traces. Worker code only — app assets ship via each
# app's own CI, so browser symbolication is a separate follow-up (ADR-008).
# Top-level key: must stay above the first table or TOML nests it under one.
upload_source_maps = true

# Workers Logs — queryable structured logs + uncaught exceptions, retained
# server-side. ADR-008 §1: this is the platform-native answer to ADR-003's
# "cross-Worker observability is split across three log streams", and it is
# configuration rather than per-route instrumentation.
[observability]
enabled = true

[vars]
API_BASE = "https://api.proappstore.online"
AGENTS_BASE = "https://agents.proappstore.online"
GITHUB_ORG = "proappstore-online"
AUTH_START = "https://api.proappstore.online/v1/auth/github/start"
# Which providers the MCP login page offers, in order — the first one gets
# autofocus (oauth-provider.ts:180-184), so GitHub is the primary button.
# This is the single source of truth: continueAuthorize 400s an unlisted provider
# rather than silently defaulting (oauth-provider.ts:302-310). Keep that.
#
# GitHub was disabled here on 2026-08-16 (d584a45) because the API Worker's
# GITHUB_CLIENT_ID had just been deleted and the button led to a 503. PAS has
# always had its own GitHub OAuth app (#61) — the id is restored in
# packages/backend/wrangler.toml, so the button works again. See #141.
AUTH_PROVIDERS = "github,google"

# Secrets set via `wrangler secret put`:
#   SESSION_SIGNING_KEY
#   GITHUB_TOKEN (org-level PAT for repo operations)
#   INTERNAL_TOKEN (service-to-service auth for the agents Worker, and for
#     GET /v1/auth/me/account — the first-party gate behind whoami's email +
#     sign-in provider, #136. Without it whoami still prints uid/login/roles.)
#
# Optional read-only mode — set to "1" to block every mutating MCP tool and
# audit the denial. Leave unset for normal read/write operation.
#   MCP_READ_ONLY = "1"

[[routes]]
pattern = "mcp.proappstore.online/*"
zone_name = "proappstore.online"

# Sibling Workers MUST be called over service bindings: same-zone subrequests
# bypass route-mapped Workers (they go to the origin DNS record instead), so a
# plain fetch("https://api.proappstore.online/…") never reaches the API worker.
[[services]]
binding = "API"
service = "proappstore-api"

[[services]]
binding = "AGENTS"
service = "proappstore-agent-teams"

[[services]]
binding = "ADMIN"
service = "proappstore-admin"

[[services]]
binding = "HOST"
service = "proappstore-host"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "125418919bd640dcb3c45a7687b27162"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "PasMcpAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PasMcpAgent"]
