name: Publish Knowledge Base

on:
  push:
    branches: [main]
    # Include the workflow's own path so the commit that FIRST adds this file
    # triggers a build. Otherwise, when the KB content is unchanged, the publish
    # commit only touches kb.yml and the path filter never matches — so the
    # Zensical site never builds (the bug that left KBs unpublished / 404).
    paths: ['KNOWLEDGE.md', 'docs/**', '.github/workflows/kb.yml']
  workflow_dispatch:

# Keyless KB ingest (#57): the runner mints a GitHub OIDC token instead of
# carrying the shared INTERNAL_TOKEN, so kb-host can bind the write to this
# repo's own app prefix.
permissions:
  contents: read
  id-token: write

concurrency:
  group: kb-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on a Knowledge Base existing
        id: gate
        run: |
          if [ -f KNOWLEDGE.md ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "go=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == '1'
        with:
          node-version: 22
      - name: Build Zensical site
        if: steps.gate.outputs.go == '1'
        env:
          APP: ${{ github.event.repository.name }}
        run: |
          python -m pip install --quiet zensical
          rm -rf kb-src && mkdir -p kb-src/assets kb-src/stylesheets
          cp KNOWLEDGE.md kb-src/index.md
          if [ -d docs ]; then cp -r docs/. kb-src/; fi
          # ── ProAppStore brand: logo + favicon (canonical Apps symbol) ──
          cat > kb-src/assets/logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ProAppStore"><defs><linearGradient id="brand-pas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#brand-pas)"/><g fill="#ffffff" color="#ffffff"><rect x="17" y="18" width="13" height="13" rx="3.5"/><rect x="35" y="15" width="13" height="13" rx="3.5"/><rect x="17" y="36" width="13" height="13" rx="3.5"/><rect x="35" y="33" width="13" height="13" rx="3.5"/></g></svg>
          SVG
          cp kb-src/assets/logo.svg kb-src/assets/favicon.svg
          # ── ProAppStore brand: accent purple (#7c3aed light / #a78bfa dark) ──
          cat > kb-src/stylesheets/extra.css <<'CSS'
          :root > * {
            --md-primary-fg-color: #7c3aed;
            --md-primary-fg-color--light: #a78bfa;
            --md-primary-fg-color--dark: #4c1d95;
            --md-accent-fg-color: #7c3aed;
          }
          [data-md-color-scheme="slate"] {
            --md-primary-fg-color: #a78bfa;
            --md-primary-fg-color--light: #c4b5fd;
            --md-primary-fg-color--dark: #7c3aed;
            --md-accent-fg-color: #a78bfa;
          }
          .md-header__title { font-weight: 700; letter-spacing: -0.01em; }
          CSS
          # ── Branded site config ──
          cat > mkdocs.yml <<YAML
          site_name: $APP — Knowledge Base
          site_url: https://kb.proappstore.online/$APP/
          docs_dir: kb-src
          copyright: Built on ProAppStore · proappstore.online
          theme:
            name: material
            logo: assets/logo.svg
            favicon: assets/favicon.svg
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: lucide/sun
                  name: Switch to dark mode
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: lucide/moon
                  name: Switch to light mode
          extra_css:
            - stylesheets/extra.css
          YAML
          zensical build
      - name: Publish to kb-host (R2 via Worker binding)
        if: steps.gate.outputs.go == '1'
        env:
          APP: ${{ github.event.repository.name }}
        run: |
          # Keyless (#57): mint an OIDC token bound to this repo. kb-host derives
          # the writable prefix from the `repository` claim, so this run cannot
          # write another app's KB or the reserved `platform/` docs prefix.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=proappstore-kb-host" | jq -r '.value')
          if [ -z "$OIDC" ] || [ "$OIDC" = "null" ]; then echo "::error::could not obtain OIDC token — cannot publish KB"; exit 1; fi
          out=site
          [ -d "$out" ] || out=public
          cd "$out"
          find . -type f | while read -r f; do
            # Encode each path segment (#195): a filename with a space or a
            # reserved character would otherwise break the ingest URL. The slash
            # is kept as the separator; jq's @uri escapes everything else.
            enc=$(printf '%s' "${f#./}" | jq -sRr 'split("/") | map(@uri) | join("/")')
            curl -fsS -X PUT "https://kb.proappstore.online/_ingest/$APP/$enc" -H "Authorization: Bearer $OIDC" --data-binary "@$f" >/dev/null
          done
          echo "Knowledge Base published → https://kb.proappstore.online/$APP/"
