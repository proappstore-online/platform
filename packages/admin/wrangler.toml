name = "proappstore-admin"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Secrets (set via `wrangler secret put`):
#   CF_API_TOKEN        Pages:Edit + DNS:Edit on proappstore.online
#   GITHUB_TOKEN        fine-grained PAT for proappstore-online org (repo create + contents)
#   SESSION_SIGNING_KEY HS256 key for /api/publish-app session auth
#   INTERNAL_TOKEN      shared with proappstore-agent-teams — auth for /api/agent-deploy

# Custom domain: admin.proappstore.online
# Set via CF dashboard: Workers & Pages > proappstore-admin > Settings > Domains & Routes

# De-minify Worker stack traces. Worker code only — app assets ship via each
# app's own CI, so browser symbolication is a separate follow-up (ADR-008).
# Top-level key: must stay above the first table or TOML nests it under one.
upload_source_maps = true

# Workers Logs — queryable structured logs + uncaught exceptions, retained
# server-side. ADR-008 §1: this is the platform-native answer to ADR-003's
# "cross-Worker observability is split across three log streams", and it is
# configuration rather than per-route instrumentation.
[observability]
enabled = true

[vars]
CF_ACCOUNT_ID = "c1089bfcc43c1c6c2aa89e584e86f0bc"
PAS_ZONE_ID = "14928daaff60902cc89003a2ebeb99fe"
PUBLISHERS_ORG = "proappstore-online"
APPS_DOMAIN_BASE = "proappstore.online"

[[d1_databases]]
binding = "DB"
database_name = "pas"
database_id = "585bbda3-0016-42ad-a53d-c089f1864fcb"

# Durable publish provisioning (spike). ProvisionWorkflow re-runs the publish
# path with per-step retry + persistence; triggered via /api/provision-workflow.
# The inline provisionApp() path remains the default.
[[workflows]]
name = "pas-provision"
binding = "PROVISION_WORKFLOW"
class_name = "ProvisionWorkflow"
