name = "proappstore-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
# #310: fetches to a public URL go out through the public internet. Without it, a
# backend fetch of pas-data-<app>.<DATA_WORKER_HOST> from a NON-request context (the
# cron scheduler, the queue consumer and so the PAS RPC behind app workers) is
# answered `404 error code: 1042`; the same fetch from an HTTP handler is not.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
# SECURITY (#80, #315): no workers.dev URL. Direct traffic (this worker's own
# api.proappstore.online route, a workers.dev hostname if it existed, any service
# binding) reaches the default fetch export, which strips X-PAS-App / X-PAS-Host;
# only the host's binding to the HostApi entrypoint keeps them. A workers.dev URL
# would add one more way past the host, so it stays off.
workers_dev = false

# De-minify Worker stack traces. Worker code only — app assets ship via each
# app's own CI, so browser symbolication is a separate follow-up (ADR-008).
# Top-level key: must stay above the first table or TOML nests it under one.
upload_source_maps = true

# Workers Logs — queryable structured logs + uncaught exceptions, retained
# server-side. ADR-008 §1: this is the platform-native answer to ADR-003's
# "cross-Worker observability is split across three log streams", and it is
# configuration rather than per-route instrumentation.
[observability]
enabled = true

# Embed the data-worker bundle and the app-worker entry shim (#253) before
# bundling this worker, so both ship with the backend (no runtime GitHub fetch).
# Runs on `wrangler deploy` and `wrangler dev`. See scripts/embed-*.mjs.
[build]
command = "node scripts/embed-data-worker.mjs && node scripts/embed-app-worker-shim.mjs"

[vars]
# Public base URL of this API — used to build OAuth callback URLs (routes/auth.ts).
APP_BASE = "https://api.proappstore.online"
MCP_ORIGIN = "https://mcp.proappstore.online"
# workers.dev host of the per-app data workers (#153). Backend-internal calls
# (actions, registration-time /validate, provisioning) go straight to
# https://pas-data-<app>.<DATA_WORKER_HOST> with X-Internal-Token, never via
# the public data-<app>.proappstore.online proxy hop (lib/data-worker-url.ts).
DATA_WORKER_HOST = "serge-the-dev.workers.dev"
# #196 kill switch — uncomment once every hosted app is rebuilt on
# @proappstore/sdk >= 1.16.46 (watch for "[pas_session-fragment]" warnings to go
# quiet). Stops delivering #pas_session= to app origins; first-party unaffected.
# RETIRE_FRAGMENT_DELIVERY = "1"
# Turnstile widget site key (#26) — PUBLIC, so a var. Together with the
# TURNSTILE_SECRET_KEY secret it requires a widget token on
# POST /v1/auth/credentials/register. Leave unset until the sign-up forms read
# GET /v1/auth/turnstile and send the token: docs/turnstile.md.
# TURNSTILE_SITE_KEY = "0x..."
# PAS GitHub OAuth App client id. PUBLIC by design — it is sent to the browser in
# the authorize URL on every sign-in — so it lives here in git, NOT as a secret.
#
# Do not "clean this up" into a Worker secret (#141). It was one from 2026-08-16
# 07:50 to 08:5x on the premise that this value pointed at FreeAppStore. It does
# not: FAS's app was Ov23liuUpYPXc1ikEFm2, a different id that only ever lived in
# packages/cli and was removed in 4a17839. This one is PAS's own, verified in #61.
# Because it was a var and not a secret, deleting it here deleted it from the live
# Worker on the next deploy (wrangler replaces the whole vars set; secrets survive)
# and every GitHub sign-in 503'd — routes/auth.ts:322 gates on the client id alone.
# Nothing in .github/workflows/ syncs it, so a redeploy could not heal it either.
# In git, a redeploy always restores it and the value is reviewable in the diff.
#
# Only the secret half is a secret: GITHUB_CLIENT_SECRET, set with
# `wrangler secret put` on proappstore-api (rotated 2026-07-16 under #61).
# Asymmetry worth knowing before you tidy anything here: GOOGLE_CLIENT_ID is a
# *secret* on this Worker rather than a var, which is the only reason Google
# sign-in survived that deploy untouched. That inconsistency is deliberate-by-
# accident and is being left as-is; it is not a licence to move this one.
GITHUB_CLIENT_ID = "Ov23ctEs8trbfizdBGfQ"
# GitHub connector App (#258) — public identifiers of the "ProAppStore Connector" GitHub App,
# registered by the owner 2026-10-07 (issue #258, human step 1; https://github.com/apps/proappstore-connector).
# While any of the three secrets below is missing, every /v1/connectors/github/* route and
# PAS.connectors.token('github') answers 503 "connector not configured" — deploys are unaffected.
# Distinct from GITHUB_CLIENT_ID above (the sign-in OAuth app); do not reuse or merge the names.
GH_APP_ID = "5218621"
GH_APP_CLIENT_ID = "Iv23liw9Cq9jPb4mByH9"
GH_APP_SLUG = "proappstore-connector"
CF_ACCOUNT_ID = "c1089bfcc43c1c6c2aa89e584e86f0bc"
VAPID_PUBLIC_KEY = "BPg6E92QAOhdcif_HckOEGY6mL03VKWNQ3CS1xQX5q59fXURI1xCGwwBr4Vsv7gn3TXIGSJquJwvHGYRbMcAQc0"
# Comma-separated `gh:<id>` strings allowed to approve/reject submissions.
ADMIN_GITHUB_IDS = "gh:2824906"

# App workers (#253, ADR-009) run on the `loader` backend (Dynamic Workers).
# Enabled 2026-10-07 for the #305 spike measurements, after #274 closed and with
# Serge's go-ahead. No app is enabled until a platform admin sets
# app_workers_enabled (first-party only, cap of 5).
#
# #275 account guard: today's app-worker usage summed over every app. Above it,
# the 15-minute cron closes new enables (app_worker_platform.open = 0) and records
# an `app_worker_account_ceiling` alert; running apps keep running, and an admin
# reopens with PUT /v1/admin/app-workers/open. cpu_ms is wall-clock: a proxy known
# when the invocation returns. The worker's real cpuTime reaches AppWorkerTail
# afterwards and is recorded per invocation (child_cpu_ms, #308), not metered.
# Revisit with duperdash's measured usage before #267.
APP_WORKER_ACCOUNT_CEILING = '{ "cpu_ms": 36000000, "invocations": 100000 }'
APP_WORKER_BACKEND = "loader"

# Session-key drift check (#70): every 15 minutes, mint a probe session with the
# CURRENT SESSION_SIGNING_KEY and present it to a sample of data workers; a 401
# means a worker still holds a rotated-away key, and the check dispatches
# redeploy-data-workers.yml for it (needs GITHUB_TOKEN with actions:write).
# On demand: GET /v1/internal/session-key-drift with X-Internal-Token.
[triggers]
# #123 needs a five-minute tick for durable registered-action schedules. The
# handler keeps drift, alert evaluation and metering on their established
# fifteen-minute/hourly cadence; do not add a second */15 trigger here.
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pas"
database_id = "585bbda3-0016-42ad-a53d-c089f1864fcb"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "pas-storage"

# Workers AI binding — backs the app.ai SDK primitive.
# Free quota included with Workers Paid; pay-as-you-go beyond.
[ai]
binding = "AI"

# Dynamic Workers (Worker Loader) — runs app workers (#253, ADR-009 loader backend).
[[worker_loaders]]
binding = "LOADER"

# App-event queue (#257, ADR-009): schedule and worker-hook deliveries run in this Worker's
# queue() consumer, with retries (delay 2 ** attempt * 10 s) and a dead-letter queue. Both
# queues and the R2 lifecycle rule for `_hook-bodies/` are created idempotently by
# deploy-backend.yml BEFORE `wrangler deploy`: a missing queue fails the deploy.
# max_batch_size = 1: one invocation may take 5 minutes, a batch is retried as a unit, and it
# keeps the loader under its 4-concurrent-Dynamic-Workers cap. max_concurrency = 5 matches the
# prototype's cap of 5 app workers (raise it with #267). max_retries must equal
# APP_EVENT_MAX_RETRIES in lib/app-event-queue.ts.
[[queues.producers]]
binding = "APP_EVENTS"
queue = "pas-app-events"

[[queues.consumers]]
queue = "pas-app-events"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "pas-app-events-dlq"
max_concurrency = 5

# The dead-letter consumer fails the delivery's row and deletes any spilled hook body.
[[queues.consumers]]
queue = "pas-app-events-dlq"
max_batch_size = 10
max_retries = 3

# Workers Analytics Engine — first-party cookieless analytics for Pro apps.
# Events written by analytics-ingest.ts, queried by analytics-stats-routes.ts
# via the CF SQL API (CF_ANALYTICS_API_TOKEN secret).
#
# The `dataset` values below MUST match src/lib/telemetry-datasets.ts — the read
# side names the dataset in SQL and nothing links the two. They drifted once
# (queries read `pas_app_analytics` while writes went here), which reads as
# "analytics never worked" rather than as a config error.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "pas_analytics"

# Error telemetry — 5xx and unhandled exceptions (ADR-008). Separate dataset, not
# a new event `kind` on ANALYTICS: the analytics diagnostics verdict counts every
# row for an app, so errors sharing that dataset would report an app as healthy
# on the strength of its own failures.
[[analytics_engine_datasets]]
binding = "ERRORS"
dataset = "pas_app_errors"

# Financial usage ledger for #25. Kept distinct from visitor analytics: rows
# carry a different schema and are payout evidence. PAYOUT_METER_SALT and the
# read tokens are secrets; see docs/payout-metering.md before enabling it.
[[analytics_engine_datasets]]
binding = "PAYOUT_METER"
dataset = "pas_payout_meter"

# App-worker PAS calls (#254, ADR-009 §4): one data point per call, indexed by
# app; blobs method, action, outcome. Individual calls are never written to D1.
[[analytics_engine_datasets]]
binding = "APP_WORKER_CALLS"
dataset = "pas_app_worker_calls"

# Realtime rooms — Durable Object for WebSocket fan-out.
[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" }
]

[[migrations]]
tag = "v1"
new_classes = ["Room"]

# Anonymous registered-action calls (#211): 120 per 60 s per (app, client IP).
# namespace_id is account-unique; PWS holds 0, 2 and 1001.
[[unsafe.bindings]]
name = "PUBLIC_ACTION_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1000"
simple = { limit = 120, period = 60 }

# Workers AI spend bounds (#218). /v1/ai/*: 20 requests per minute per user.
# namespace_id is account-unique; PWS holds 0, 2 and 1001; PAS holds 1000-1003.
[[unsafe.bindings]]
name = "AI_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Moderation model calls (#214/#215/#217): 60 per minute per user, key mod:{userId}.
[[unsafe.bindings]]
name = "MODERATION_RATE_LIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[routes]]
pattern = "api.proappstore.online/*"
zone_name = "proappstore.online"

# Self service binding — a Worker's fetch() to its own route-mapped hostname
# never reaches it (same-zone subrequests bypass route-mapped Workers), so
# internal re-entry (submissions-review → /v1/provision) goes through SELF.
[[services]]
binding = "SELF"
service = "proappstore-api"

# #355/#356: only this service binding may request resource-bound opaque MCP
# credentials.  It is deliberately distinct from the public MCP transport.
[[services]]
binding = "MCP"
service = "proappstore-mcp"

# PAS provisioning is fully self-contained in packages/backend/src/routes/
# provision.ts — see ADR notes there. The legacy [[services]] binding to
# freeappstore-admin (binding name ADMIN) was removed 2026-05-28 per
# PLAN-ARCH-CLEANUP Phase 4 (admin-worker-per-store principle). It had
# been dead config — no code path called env.ADMIN.fetch().

# Secrets (set via `wrangler secret put`):
#   CF_API_TOKEN                    (for provisioning D1/Pages/Workers)
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   STRIPE_PRO_MONTHLY_PRICE_ID     (the live Stripe price for $5/mo Pro;
#                                    until set, GET /v1/pricing returns null
#                                    and the Console hides the Upgrade button)
#   SESSION_SIGNING_KEY             (signs PAS session JWTs — routes/auth.ts)
#   VAPID_PRIVATE_KEY               (for Web Push notifications)
#   GITHUB_CLIENT_SECRET            (PAS GitHub OAuth app — enables browser sign-in;
#                                    callback: https://api.proappstore.online/v1/auth/github/callback.
#                                    The client ID is NOT a secret — it is a [vars]
#                                    entry above. See #141.)
#   GOOGLE_CLIENT_ID                (shared Google OAuth client — add the same
#   GOOGLE_CLIENT_SECRET             callback as an authorized redirect URI. Both
#                                    halves are secrets here, unlike GitHub's.)
#   APP_SECRET_KEK                  (32-byte base64 key for envelope encryption
#                                    of app proxy secrets; without this, proxy/
#                                    secrets/allowlist endpoints return 503)

#   GH_APP_PRIVATE_KEY              (#258 — GitHub App private key, PKCS#8 PEM; see issue #258 step 2)
#   GH_APP_WEBHOOK_SECRET           (#258 — verifies POST /v1/connectors/github/webhook)
#   GH_APP_CLIENT_SECRET            (#258 — App client secret for the install-time code exchange)

# Headless QA executor (#38) — nudged after POST /v1/apps/:appId/qa/runs.
[[services]]
binding = "QA_WORKER"
service = "proappstore-qa-worker"
