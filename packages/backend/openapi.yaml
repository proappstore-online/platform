components:
  securitySchemes:
    githubOidc:
      type: http
      scheme: bearer
      bearerFormat: GitHub Actions OIDC JWT
      description: 'A GitHub Actions OIDC token (permissions: id-token: write; audience https://api.proappstore.online). Accepted by the keyless deploy routes and POST /v1/auth/exchange/oidc.'
    appToken:
      type: http
      scheme: bearer
      bearerFormat: pas_at_…
      description: 'Personal app token (#154): per-user, per-app, revocable; accepted by POST /v1/apps/{appId}/actions/{name} only. Never by MCP or any other route.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: PAS session JWT (HS256). uid/login/roles/appRoles claims.
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Shared secret for service-to-service calls.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ToolRegistrationResult:
      type: object
      required: [ok, registered, bytes, bytesPerTool, estimatedTokens, warnings]
      properties:
        ok:
          type: boolean
        registered:
          type: integer
          description: Number of tools now registered for the app.
        bytes:
          type: integer
          description: Model-facing payload of the whole manifest — name, description and params per tool, never SQL — in UTF-8 bytes (#117).
        bytesPerTool:
          type: number
          description: bytes / registered, rounded.
        estimatedTokens:
          type: integer
          description: bytes / 4, rounded — a rule-of-thumb token occupancy per MCP call, not a tokenizer.
        warnings:
          type: array
          items:
            type: string
          description: Empty when under the 50 000-byte soft threshold; otherwise one message naming the cost. Never a rejection.
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    User:
      type: object
      properties:
        uid:
          type: string
          description: e.g. gh:123 | google:123 | cred:uuid
        login:
          type: string
        avatarUrl:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - user
            - creator
            - admin
        appRoles:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    App:
      type: object
      properties:
        id:
          type: string
        creator_id:
          type: string
        d1_database_id:
          type: string
        created_at:
          type: string
          format: date-time
    Submission:
      type: object
      properties:
        id:
          type: string
        app_id:
          type: string
        creator_id:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        name:
          type: string
        category:
          type: string
        description:
          type: string
        suggested_monthly_price_cents:
          type: integer
        repo_url:
          type: string
        created_at:
          type: string
          format: date-time
    Subscription:
      type: object
      properties:
        status:
          type: string
          enum:
          - active
          - trialing
          - past_due
          - canceled
          - none
        tier:
          type: string
        current_period_end:
          type: integer
        cancel_at_period_end:
          type: boolean
    Pricing:
      type: object
      properties:
        price_cents:
          type: integer
          example: 900
        currency:
          type: string
          example: usd
        interval:
          type: string
          example: month
