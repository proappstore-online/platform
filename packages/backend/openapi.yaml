  /v1/apps/{appId}/tokens:
    post:
      tags:
      - Tokens
      summary: Mint a personal app token (#154)
      description: Session only (a pas_at_ token can never manage tokens). Returns the plaintext `pas_at_…` token ONCE; only its SHA-256 is stored. `access` and `expires_in` (seconds) are required. Lifetime is capped at 90 days when the request Origin is an app origin, 365 days from a first-party origin or no Origin — no token is non-expiring. `actions` restricts the token to named actions, each of which must exist for the app.
      operationId: post_v1_apps_appId_tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - access
              - expires_in
              properties:
                label:
                  type: string
                expires_in:
                  type: integer
                  description: Lifetime in seconds (min 60)
                access:
                  type: string
                  enum:
                  - read
                  - write
                actions:
                  type: array
                  items:
                    type: string
                  maxItems: 50
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: pas_at_… — shown once
                  token_id:
                    type: string
                  app_id:
                    type: string
                  label:
                    type: string
                    nullable: true
                  access:
                    type: string
                  actions:
                    type: array
                    items:
                      type: string
                    nullable: true
                  created_origin:
                    type: string
                    nullable: true
                  created_at:
                    type: integer
                  expires_at:
                    type: integer
                  note:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: App not found
      security:
      - bearerAuth: []
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
      - Tokens
      summary: List my tokens for an app (#154)
      description: Never returns the token or its hash.
      operationId: get_v1_apps_appId_tokens
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        token_id:
                          type: string
                        app_id:
                          type: string
                        label:
                          type: string
                          nullable: true
                        access:
                          type: string
                          enum:
                          - read
                          - write
                        actions:
                          type: array
                          items:
                            type: string
                          nullable: true
                        created_origin:
                          type: string
                          nullable: true
                        created_at:
                          type: integer
                        last_used_at:
                          type: integer
                          nullable: true
                        expires_at:
                          type: integer
                        expired:
                          type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - bearerAuth: []
      parameters:
      - name: appId
        in: path
        required: true
        schema:
          type: string
