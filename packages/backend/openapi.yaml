  /v1/apps/{appId}/alerts:
    get:
      tags:
      - Logs
      summary: Operational alerts for an app (#107)
      description: 'Owner only. Spikes the scheduled evaluator recorded from app_logs (client runtime errors, server-side action failures and 5xx) and QA runs: kind, window, count, affected users (a count), the previous window''s baseline, top categories / operations / fingerprints and build metadata. Never messages, request bodies, tokens or user ids. Query: since (ms, default 7 days), limit (≤ 200), open=1 for unacknowledged only.'
      operationId: get_v1_apps_appId_alerts
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        app_id:
                          type: string
                        kind:
                          type: string
                          enum:
                          - error_spike
                          - action_failures
                          - server_5xx
                          - qa_failures
                        window_start:
                          type: integer
                        window_end:
                          type: integer
                        count:
                          type: integer
                        affected_users:
                          type: integer
                          description: distinct sessions or anonymous client ids — a count, never a list
                        baseline:
                          type: integer
                          description: the same measure in the previous window
                        top:
                          type: object
                          properties:
                            categories:
                              type: array
                              items:
                                type: object
                            operations:
                              type: array
                              items:
                                type: object
                            fingerprints:
                              type: array
                              items:
                                type: object
                        build:
                          type: object
                          nullable: true
                        created_at:
                          type: integer
                        acknowledged_at:
                          type: integer
                          nullable: true
                        acknowledged_by:
                          type: string
                          nullable: true
                  since:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
      parameters:
      - name: appId
        in: path
        required: true
        schema:
