# Template for proappstore-online/proappstore/.github/workflows/marketing-deploy.yml (#399).
#
# The platform accepts marketing artifacts ONLY from a GitHub OIDC token minted
# for audience https://api.proappstore.online/marketing by exactly this file, at
# that path, on main, in proappstore-online/proappstore (repository and owner IDs
# pinned) — packages/backend/src/routes/marketing-deploy.ts. Renaming or moving
# the file means changing MARKETING_WORKFLOW_REF there first. No secret is used:
# keep this job free of the Pages deploy's CLOUDFLARE_API_TOKEN.
#
# Order: build → upload (verified, never activates) → activate (re-verified,
# atomic) → live check → roll back to the previous revision if the check fails.
# A failure before activation changes nothing: the previous site keeps serving.
name: Deploy marketing site

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: App id (the site is about-<app_id>.proappstore.online)
        required: true
      revision:
        description: Owner-published content revision to build and activate (platform#398)
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketing-${{ inputs.app_id }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      API: https://api.proappstore.online
      AUDIENCE: https://api.proappstore.online/marketing
      APP_ID: ${{ inputs.app_id }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$APP_ID" =~ ^[a-z][a-z0-9-]{0,56}$ && "$APP_ID" != about-* ]] || { echo "::error::invalid app_id"; exit 1; }
          [[ "$REVISION" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || { echo "::error::invalid revision"; exit 1; }

      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci

      - name: Fetch the approved content snapshot
        # platform#398 provides the build snapshot of an owner-published revision
        # (content JSON + approved images). Until it lands this step fails, so
        # nothing unapproved can be built or uploaded.
        run: |
          echo "::error::the platform#398 build-snapshot endpoint is not available yet"
          exit 1

      - name: Build
        run: npm run build:marketing -- --snapshot snapshot/content.json --assets-dir snapshot/assets --out marketing/out

      - name: Upload, activate, verify live, roll back on failure
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          const { API, AUDIENCE, APP_ID, REVISION, ACTIONS_ID_TOKEN_REQUEST_URL: url, ACTIONS_ID_TOKEN_REQUEST_TOKEN: rt } = process.env;
          const idToken = async () => {
            const r = await fetch(`${url}&audience=${encodeURIComponent(AUDIENCE)}`, { headers: { Authorization: `Bearer ${rt}` } });
            if (!r.ok) throw new Error(`OIDC token request failed (${r.status})`);
            const { value } = await r.json();
            console.log(`::add-mask::${value}`);
            return value;
          };
          const call = async (method, path, body) => {
            const r = await fetch(`${API}/v1/apps/${APP_ID}/marketing/${path}`, {
              method, body, headers: { Authorization: `Bearer ${await idToken()}`, ...(typeof body === 'string' ? { 'Content-Type': 'application/json' } : {}) },
            });
            const text = await r.text();
            if (!r.ok) throw new Error(`${method} ${path} → ${r.status}: ${text}`);
            return JSON.parse(text);
          };

          const manifestText = readFileSync('marketing/out/artifact-manifest.json', 'utf8');
          const manifest = JSON.parse(manifestText);
          if (manifest.appId !== APP_ID || manifest.revision !== REVISION || manifest.preview !== false) throw new Error('built artifact is not this app/revision');
          const form = new FormData();
          form.set('manifest', manifestText);
          for (const f of manifest.files) form.append(f.path, new Blob([readFileSync(`marketing/out${f.path}`)]), f.path.split('/').pop());
          console.log('upload', JSON.stringify(await call('PUT', `revisions/${REVISION}`, form)));

          const activation = await call('POST', 'activate', JSON.stringify({ revision: REVISION }));
          console.log('activate', JSON.stringify(activation));

          const site = `https://about-${APP_ID}.proappstore.online`;
          const live = async () => {
            for (const [path, method] of [['/', 'GET'], ['/', 'HEAD'], ['/robots.txt', 'GET'], ['/sitemap.xml', 'GET']]) {
              const r = await fetch(site + path, { method, cache: 'no-store' });
              if (r.status !== 200 || r.headers.get('x-pas-marketing-revision') !== REVISION) return `${method} ${path} → ${r.status} rev=${r.headers.get('x-pas-marketing-revision')}`;
            }
            return null;
          };
          const problem = await live();
          if (!problem) { console.log(`live: ${site} serves ${REVISION}`); process.exit(0); }
          console.log(`::error::live check failed: ${problem}`);
          if (activation.previous && !activation.unchanged) {
            console.log('rollback', JSON.stringify(await call('POST', 'rollback', JSON.stringify({ revision: activation.previous }))));
          }
          process.exit(1);
          EOF
